services:
  lvdb:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: "lv"
      POSTGRES_USER: "lv"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "6433:5432"
    healthcheck:
      test: psql 'host=localhost port=5432 dbname=lv user=lv password=$${POSTGRES_PASSWORD}' -qtA -c 'select 1;' || exit 1
      timeout: 5s
      interval: 5s
      retries: 5

  migrate:
    build:
      dockerfile: postgres/dockerfile
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    entrypoint:
      /bin/sh -c "cd database/postgres && pgmigrate -c \"postgresql://lvdb:5432/lv?user=lv&password=$${POSTGRES_PASSWORD}\" -t latest migrate"
    volumes:
      - .:/database
    depends_on:
      lvdb:
        condition: service_healthy

  wait-for-migrate:
    image: busybox
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: /bin/sh -c "echo 'Migration completed successfully'"
