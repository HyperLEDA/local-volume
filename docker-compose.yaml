services:
  lvdb:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: "lv"
      POSTGRES_USER: "lv"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "6433:5432"
    healthcheck:
      test: psql 'host=localhost port=5432 dbname=lv user=lv password=$${POSTGRES_PASSWORD}' -qtA -c 'select 1;' || exit 1
      timeout: 5s
      interval: 5s
      retries: 5
