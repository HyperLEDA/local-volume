name: "[python] Preview worker"

on:
  pull_request:
    paths:
      - Dockerfile.preview
      - lv_backend/preview_worker.py
      - tests/test_preview_worker.py
      - .github/workflows/preview-worker.yaml
  push:
    branches: [main]
    paths:
      - Dockerfile.preview
      - lv_backend/preview_worker.py
      - tests/test_preview_worker.py
      - .github/workflows/preview-worker.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Build preview worker
        run: docker build -f Dockerfile.preview -t lv-preview:ci .

      - name: Check worker CLI
        run: docker run --rm lv-preview:ci --help

      - name: Publish preview worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}-preview"
          docker tag lv-preview:ci "$image:${GITHUB_SHA::12}"
          docker tag lv-preview:ci "$image:latest"
          docker push "$image:${GITHUB_SHA::12}"
          docker push "$image:latest"
