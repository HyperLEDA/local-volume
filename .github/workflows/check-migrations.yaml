name: Check migrations

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check migration file names
        run: make check-migrations

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Start database
        run: docker compose up -d --wait lvdb

      - name: Apply migrations
        run: uv run lv-backend migrate

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Lint database schema
        env:
          PGHOST: localhost
          PGPORT: 6433
          PGUSER: lv
          PGPASSWORD: password
          PGDATABASE: lv
        run: bunx schemalint@2.3.2
